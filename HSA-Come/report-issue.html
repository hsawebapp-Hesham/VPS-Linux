  <!-- المحتوى الرئيسي (Main content) -->
  <main id="main-content" tabindex="-1">
    <div class="container">
      <!-- عنوان القسم (Section header) -->
      <div class="section-header reveal">
        <h1 class="section-title" data-i18n="report.title"></h1>
        <p class="section-subtitle" data-i18n="report.subtitle"></p>
      </div>

      <div class="grid grid-2">
        <!-- بطاقة نموذج الإبلاغ (Report form card) -->
        <div class="card">
          <div class="card-body">
            <form id="report-form">
              <div class="form-group">
                <label class="form-label" for="issue-name" data-i18n="report.form.name"></label>
                <input class="form-control" type="text" id="issue-name" name="name" required minlength="2" autocomplete="name" aria-describedby="error-name">
                <p class="form-error" id="error-name" data-error-for="name" role="alert"></p>
              </div>
              <div class="form-group">
                <label class="form-label" for="issue-email" data-i18n="report.form.email"></label>
                <input class="form-control" type="email" id="issue-email" name="email" required autocomplete="email" aria-describedby="error-email">
                <p class="form-error" id="error-email" data-error-for="email" role="alert"></p>
              </div>
              <div class="form-group">
                <label class="form-label" for="issue-app" data-i18n="report.form.app"></label>
                <select class="form-control" id="issue-app" name="app" required aria-describedby="error-app">
                  <option value="" disabled selected>اختر التطبيق</option>
                </select>
                <p class="form-error" id="error-app" data-error-for="app" role="alert"></p>
              </div>
              <div class="form-group">
                <label class="form-label" for="issue-message" data-i18n="report.form.message"></label>
                <textarea class="form-control" id="issue-message" name="message" rows="6" required minlength="10" maxlength="500" aria-describedby="hint-message error-message"></textarea>
                <p class="form-hint" id="hint-message" data-i18n="report.form.message.hint"></p>
                <p class="form-error" id="error-message" data-error-for="message" role="alert"></p>
              </div>
              <button type="submit" class="btn btn-primary btn-lg btn-block" data-i18n="report.form.submit"></button>
              <div id="form-success" class="form-success" role="status">
                <strong data-i18n="report.success.title"></strong>
                <p data-i18n="report.success.message"></p>
              </div>
            </form>
          </div>
        </div>

        <!-- بطاقة البلاغات المرسلة (My submitted issues card) -->
        <aside class="card">
          <div class="card-body">
            <h2 class="card-title" data-i18n="report.myissues.title"></h2>
            <p class="muted" data-i18n="report.myissues.subtitle"></p>
            <div id="issues-list"></div>
            <p class="muted" data-i18n="report.note"></p>
          </div>
        </aside>
      </div>
    </div>
  </main>

            <a href="mailto:hsasinai@gmail.com">hsasinai@gmail.com</a>

            <span class="contact-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg></span>
            <a href="tel:+201008361225" dir="ltr">+2 01008361225</a>
          </li>
