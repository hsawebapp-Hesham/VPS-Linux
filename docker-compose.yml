services:

  hsa-come:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./HSA-Come:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - vps-network

  hsa-notes:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./HSA-Notes:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - vps-network

  reverse-proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/hsa-come/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      hsa-come:
        condition: service_healthy
      hsa-notes:
        condition: service_healthy
    networks:
      - vps-network

networks:
  vps-network:
    external: true
    name: vps-network
