<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">HSA Notes</title>
  <desc id="desc">A modular H and N monogram for HSA Notes</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b3b50"/>
      <stop offset="1" stop-color="#0c1c2c"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b0ecd1"/>
      <stop offset="1" stop-color="#5ec39e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d59d"/>
      <stop offset="1" stop-color="#b88d4f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#06131e" flood-opacity="0.32"/>
    </filter>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="132" fill="url(#background)"/>
  <rect x="25" y="25" width="462" height="462" rx="131" fill="none" stroke="#8ed8bb" stroke-opacity="0.2" stroke-width="2"/>
  <circle cx="404" cy="105" r="46" fill="none" stroke="#8ed8bb" stroke-opacity="0.16" stroke-width="2"/>
  <circle cx="92" cy="414" r="58" fill="none" stroke="#d7b77c" stroke-opacity="0.16" stroke-width="2"/>
  <g filter="url(#shadow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M116 132V380" stroke="url(#mint)" stroke-width="38"/>
    <path d="M238 132V380" stroke="url(#mint)" stroke-width="38"/>
    <path d="M116 255H238" stroke="url(#mint)" stroke-width="32"/>
    <path d="M238 380L396 132" stroke="url(#gold)" stroke-width="38"/>
    <path d="M396 132V380" stroke="url(#gold)" stroke-width="38"/>
  </g>
  <circle cx="116" cy="132" r="10" fill="#effaf5"/>
  <circle cx="396" cy="380" r="10" fill="#f6e2b5"/>
  <path d="M116 407H396" fill="none" stroke="#8ed8bb" stroke-opacity="0.42" stroke-width="6" stroke-linecap="round"/>
